<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI预警</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; background: #e0e0e0; color: #333; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 400px; margin: 0 auto; background: #f5f7fa; min-height: 100vh; position: relative; }

        .navbar { position: sticky; top: 0; left: 0; right: 0; height: 44px; background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 100; border-bottom: 1px solid #f0f0f0; }
        .navbar .back-btn { position: absolute; left: 16px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #333; }
        .navbar .title { font-size: 17px; font-weight: 600; color: #333; }

        .warning-bar { background: #fff5f5; padding: 12px 16px; display: flex; align-items: center; gap: 6px; }
        .warning-icon { color: #faad14; font-size: 15px; }
        .warning-text { font-size: 14px; color: #ff4d4f; flex: 1; font-weight: 500; }

        .tabs { background: #ffffff; display: flex; border-bottom: 1px solid #f0f0f0; }
        .tab { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #666; position: relative; cursor: pointer; }
        .tab.active { color: #1677ff; font-weight: 600; }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 32px; height: 3px; background: #1677ff; border-radius: 2px; }

        .card-list { padding: 12px; }

        .card { background: #ffffff; border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .card-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .card-header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .card-name { font-size: 16px; font-weight: 600; color: #333; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-tag { padding: 3px 10px; border-radius: 12px; font-size: 12px; flex-shrink: 0; white-space: nowrap; }
        .status-tag.buy-not { background: #fff1f0; color: #ff4d4f; border: 1px solid #ffa39e; }
        .status-tag.buy-down { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
        .card-toggle { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 18px; transition: transform 0.3s ease; flex-shrink: 0; margin-left: 8px; }
        .card.expanded .card-toggle { transform: rotate(180deg); }

        .card-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .card.expanded .card-body { max-height: 600px; }

        .card-details { margin: 0 16px; padding: 16px; background: #fafbfc; border-radius: 16px; }
        .details-modules { display: flex; align-items: stretch; gap: 16px; }
        .data-module { flex: 0 0 auto; display: flex; flex-direction: column; gap: 0; padding: 0 4px; min-width: 0; text-align: center; }
        .data-module.module-actual { flex: 1 1 0%; }
        .module-header { font-size: 14px; color:  #000;font-weight: 400; letter-spacing: 0.3px; line-height: 16px; }
        .module-row { font-size: 13px; color:  #000; line-height: 16px; white-space: nowrap; padding: 20px 0; }
        .module-amount { font-size: 13px; color: #000; font-weight: 400; line-height: 16px; white-space: nowrap; }

        .card-reason { margin: 12px 16px 0; background: #e6f4ff; padding: 12px 14px; border-radius: 8px; font-size: 13px; color: #1677ff; line-height: 1.6; }
        .card-reason strong { color: #1677ff; font-weight: 600; }

        .card-action { padding: 12px 16px 16px; display: flex; align-items: center; gap: 12px; }
        .feedback-btn { flex: 1; background: #ffffff; border: 1px solid #1677ff; color: #1677ff; font-size: 15px; cursor: pointer; padding: 10px 0; border-radius: 8px; font-weight: 500; }
        .feedback-btn:active { opacity: 0.85; }
        .detail-btn { flex: 1; background: #1677ff; color: #fff; border: none; padding: 10px 0; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .detail-btn:active { opacity: 0.85; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content { background: #ffffff; width: 85%; max-width: 300px; border-radius: 12px; padding: 24px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 16px; }
        .modal-desc { font-size: 14px; color: #666; line-height: 1.6; text-align: left; }
        .modal-close { margin-top: 24px; background: #f0f0f0; color: #333; border: none; padding: 10px 32px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="navbar">
            <div class="back-btn">＜</div>
            <div class="title">AI预警</div>
        </div>

        <div class="warning-bar">
            <span class="warning-icon" onclick="showModal()" style="cursor:pointer">⚠️</span>
            <div class="warning-text">2个客户该买未买，1个客户买量下降，请及时关注！</div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('all', this)">全部(3)</div>
            <div class="tab" onclick="switchTab('buy-not', this)">该买未买(2)</div>
            <div class="tab" onclick="switchTab('buy-down', this)">买量下降(1)</div>
        </div>

        <div class="card-list" id="cardList"></div>
    </div>

    <div class="modal-overlay" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">说明</div>
            <div class="modal-desc">该买未买：上次购买时间~昨日的购买量=0<br><br>买量下降：上次购买时间~昨日的购买量＜预测购买量</div>
            <button class="modal-close" onclick="closeModal()">知道了</button>
        </div>
    </div>

    <div class="modal-overlay" id="helpModal" onclick="closeHelpModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">说明</div>
            <div class="modal-desc">上次购买时间~昨日的购买量</div>
            <button class="modal-close" onclick="closeHelpModal()">知道了</button>
        </div>
    </div>

    <div class="modal-overlay" id="feedbackModal" onclick="closeFeedbackModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">反馈预测不准</div>
            <div class="modal-desc" style="margin-bottom:12px">请输入预测不准的原因：</div>
            <textarea id="feedbackText" style="width:100%;height:80px;border:1px solid #d9d9d9;border-radius:6px;padding:10px;font-size:14px;resize:none;font-family:inherit" placeholder="请描述预测不准的原因..."></textarea>
            <button class="modal-close" onclick="closeFeedbackModal()">提交</button>
        </div>
    </div>

    <script>
        const data = [
            {
                id: 1,
                name: '黑山众利家畜养殖有限公司',
                type: 'buy-not',
                typeText: '该买未买',
                lastBuyDate: '2026/06/22',
                lastBuyAmount: '128.0',
                predictBuyDate: '2026/07/22',
                predictBuyAmount: '128.0',
                actualBuyAmount: '0.0',
                updateTime: '2026/09/01',
                reason: '已过预测购买时间，预测周期实际采购量为0，该客户该买未买，请及时跟进回访。'
            },
            {
                id: 2,
                name: '伊川县探肖养殖场',
                type: 'buy-not',
                typeText: '该买未买',
                lastBuyDate: '2026/06/05',
                lastBuyAmount: '85.5',
                predictBuyDate: '2026/07/05',
                predictBuyAmount: '85.0',
                actualBuyAmount: '0.0',
                updateTime: '2026/09/01',
                reason: '已过预测购买时间，预测周期实际采购量为0，该客户该买未买，请及时跟进回访。'
            },
            {
                id: 3,
                name: '黄冈一帆农牧养殖有限公司',
                type: 'buy-down',
                typeText: '买量下降',
                lastBuyDate: '2026/07/10',
                lastBuyAmount: '220.0',
                predictBuyDate: '2026/08/10',
                predictBuyAmount: '220.0',
                actualBuyAmount: '120.0',
                updateTime: '2026/09/01',
                reason: '预测周期实际采购量120.0吨，低于预测购买量，该客户买量下降，请及时关注。'
            }
        ];

        let currentFilter = 'all';

        function renderCards(filter) {
            currentFilter = filter;
            const cardList = document.getElementById('cardList');
            let html = '';

            data.forEach(item => {
                if (filter === 'all' || item.type === filter) {
                    html += `
                        <div class="card expanded" data-id="${item.id}">
                            <div class="card-header" onclick="toggleCard(this)">
                                <div class="card-header-left">
                                    <div class="card-name">${item.name}</div>
                                    <span class="status-tag ${item.type}">${item.typeText}</span>
                                </div>
                                <div class="card-toggle">∨</div>
                            </div>
                            <div class="card-body">
                                <div class="card-details">
                                    <div class="details-modules">
                                        <div class="data-module">
                                            <div class="module-header">上次购买</div>
                                            <div class="module-row">${item.lastBuyDate}</div>
                                            <div class="module-amount">${item.lastBuyAmount}吨</div>
                                        </div>
                                        <div class="data-module">
                                            <div class="module-header">AI预测</div>
                                            <div class="module-row">${item.predictBuyDate}</div>
                                            <div class="module-amount">≥${item.predictBuyAmount}吨</div>
                                        </div>
                                        <div class="data-module module-actual">
                                            <div class="module-header">预测周期实际</div>
                                            <div class="module-row">${item.lastBuyDate}-昨日</div>
                                            <div class="module-amount">${item.actualBuyAmount}吨</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-reason">
                                    <strong>预警原因：</strong>${item.reason}
                                </div>
                                <div class="card-action">
                                    <button class="feedback-btn" onclick="event.stopPropagation(); showFeedbackModal(${item.id})">反馈不准</button>
                                    <button class="detail-btn" onclick="event.stopPropagation(); goDetail(${item.id})">客户详情</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            cardList.innerHTML = html;
        }

        function toggleCard(headerEl) {
            const card = headerEl.closest('.card');
            card.classList.toggle('expanded');
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderCards(tab);
        }

        function showModal() {
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function showHelpModal() {
            document.getElementById('helpModal').classList.add('show');
        }

        function closeHelpModal() {
            document.getElementById('helpModal').classList.remove('show');
        }

        function showFeedbackModal(id) {
            document.getElementById('feedbackText').value = '';
            document.getElementById('feedbackModal').classList.add('show');
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.remove('show');
        }

        function goDetail(id) {
            const item = data.find(d => d.id === id);
            alert('跳转至客户详情：' + item.name);
        }

        renderCards('all');
    </script>
</body>
</html>
